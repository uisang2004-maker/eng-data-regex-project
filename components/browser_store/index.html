<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// PaperPath 브라우저 저장: 번역·뜻 풀이 결과를 이 브라우저의 localStorage에 둔다(서버로 보내지 않음).
// Streamlit 컴포넌트 규약(postMessage)만 직접 쓴다. args: {save: {글 해시: 항목}, clear: bool, ver: 문자열, max: 바이트}
const KEY = "paperpath-saved-v1";
let lastVer = null, sent = false;

function post(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function read() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); return (s && s.items) ? s : { items: {} }; }
  catch (e) { return { items: {} }; }
}
function size(obj) { return new Blob([JSON.stringify(obj)]).size; }
function write(store, max) {
  // 크기 상한이나 저장 공간을 넘으면 오래된 글부터 뺀다
  const keys = Object.keys(store.items).sort((a, b) => (store.items[a].ts || 0) - (store.items[b].ts || 0));
  while (keys.length && size(store) > max) delete store.items[keys.shift()];
  for (;;) {
    try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
    catch (e) {
      if (!keys.length) return false;
      delete store.items[keys.shift()];
    }
  }
}

window.addEventListener("message", function (ev) {
  const d = ev.data;
  if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  let store = read();
  let ok = true;
  if (a.ver !== lastVer) {
    lastVer = a.ver;
    if (a.clear) store = { items: {} };
    if (a.save) for (const k in a.save) store.items[k] = a.save[k];
    if (a.clear || (a.save && Object.keys(a.save).length)) ok = write(store, a.max || 3500000);
  }
  if (!sent || a.clear) {
    sent = true;
    post("streamlit:setComponentValue", { value: { items: store.items, bytes: size(store), ok: ok }, dataType: "json" });
  }
});
post("streamlit:componentReady", { apiVersion: 1 });
post("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
